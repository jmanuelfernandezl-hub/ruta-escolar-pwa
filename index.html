<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ruta Escolar — Cliente Cloud</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E2A44">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ruta Escolar">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --bg:#FFF7E6;
  --surface:#FFFFFF;
  --ink:#1E2A44;
  --ink-soft:#5A6788;
  --ink-faint:#93A0BE;
  --accent:#F5A623;
  --accent-deep:#D98A0B;
  --accent-ink:#3A2600;
  --success:#2F9E44;
  --success-bg:#E7F6EA;
  --danger:#E8555A;
  --danger-bg:#FDEAEA;
  --line:#E9DFC4;
  --shadow: 0 2px 10px rgba(30,42,68,0.08);
  --radius: 16px;
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-tap-highlight-color:transparent;
  padding-bottom:40px;
}

.app{
  max-width:520px;
  margin:0 auto;
  padding:18px 16px 60px;
}

/* LOCKSCREEN / PIN */
#lockScreen{
  position:fixed; inset:0; background:var(--bg);
  z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;
}
.lock-card{
  background:var(--surface); width:100%; max-width:400px;
  border-radius:var(--radius); padding:24px; box-shadow:0 8px 30px rgba(30,42,68,0.15);
  text-align:center;
}

/* HEADER */
header.top{
  display:flex; align-items:center; justify-content:between; margin-bottom:14px;
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-badge{
  width:38px;height:38px;border-radius:10px;
  background:var(--accent); display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display); font-weight:700; color:var(--accent-ink); font-size:18px;
  box-shadow: var(--shadow);
}
.brand h1{font-family:var(--font-display); font-size:19px; margin:0; letter-spacing:-0.01em;}
.brand p{margin:0; font-size:11px; color:var(--ink-soft); font-family:var(--font-mono); letter-spacing:0.02em;}

/* TABS */
.tabs{
  display:flex; background:var(--surface); border-radius:999px; padding:4px;
  box-shadow: var(--shadow); margin-bottom:18px;
}
.tab{
  flex:1; text-align:center; padding:9px 6px; border-radius:999px;
  font-weight:600; font-size:13.5px; cursor:pointer; color:var(--ink-soft); transition:.15s; user-select:none;
}
.tab.active{background:var(--ink); color:#fff;}
.view{display:none;}
.view.active{display:block;}

/* CARD */
.card{
  background:var(--surface); border-radius:var(--radius); padding:16px;
  box-shadow:var(--shadow); margin-bottom:14px;
}
.card h2{font-family:var(--font-display); font-size:15px; margin:0 0 10px;}
.muted{color:var(--ink-soft); font-size:13px; line-height:1.5;}
.tiny{font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono);}

/* FORM */
label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin:10px 0 4px;}
label:first-child{margin-top:0;}
input[type=text], input[type=password]{
  width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line);
  background:#FFFDF7; font-size:14.5px; font-family:var(--font-body); color:var(--ink); outline:none;
}
input:focus{border-color:var(--accent);}

.btn{
  border:none; border-radius:12px; padding:11px 16px; font-weight:700; font-size:13.5px;
  cursor:pointer; font-family:var(--font-body); display:inline-flex; align-items:center; gap:6px; justify-content:center; transition:.12s transform;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--ink); color:#fff; width:100%;}
.btn-accent{background:var(--accent); color:var(--accent-ink); width:100%;}
.btn-ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--line);}
.btn-success{background:var(--success); color:#fff;}
.btn-danger{background:var(--danger); color:#fff;}
.btn-sm{padding:7px 11px; font-size:12px; border-radius:9px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-block{width:100%;}
.row-btns{display:flex; gap:8px; margin-top:10px;}

/* SETUP LIST */
.stop-row{
  display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);
}
.stop-row:last-child{border-bottom:none;}
.stop-num{
  width:26px;height:26px;border-radius:50%; background:var(--bg); border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:12px; color:var(--ink-soft); flex-shrink:0; margin-top:2px;
}
.stop-info{flex:1; min-width:0;}
.stop-name{font-weight:700; font-size:14px;}
.stop-addr{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
.stop-geo{font-size:10.5px; font-family:var(--font-mono); margin-top:3px;}
.geo-ok{color:var(--success);}
.geo-pending{color:var(--accent-deep);}
.stop-actions{display:flex; flex-direction:column; gap:5px; flex-shrink:0;}
.icon-btn{
  border:none; background:var(--bg); border-radius:9px; width:38px; height:38px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:16px;
}
.icon-btn.nav{background:var(--accent); color:var(--accent-ink);}

/* TRIP VIEW */
.empty-state{text-align:center; padding:36px 20px; color:var(--ink-soft);}
.empty-state .glyph{font-size:34px; margin-bottom:8px;}

.suggested-card{
  background: linear-gradient(155deg, var(--ink) 0%, #2C3B5C 100%); color:#fff;
  border-radius:var(--radius); padding:18px; box-shadow: 0 6px 20px rgba(30,42,68,0.25);
  margin-bottom:16px; position:relative; overflow:hidden;
}
.suggested-eyebrow{
  font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em; color:var(--accent);
  display:flex; align-items:center; gap:6px; margin-bottom:8px;
}
.pulse-dot{
  width:7px;height:7px;border-radius:50%; background:var(--accent); animation:pulse 1.6s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(245,166,35,0.6);}
  70%{box-shadow:0 0 0 8px rgba(245,166,35,0);}
  100%{box-shadow:0 0 0 0 rgba(245,166,35,0);}
}
.suggested-name{font-family:var(--font-display); font-size:22px; font-weight:700; margin:0 0 2px;}
.suggested-addr{font-size:13.5px; color:#C6D0E8; margin-bottom:12px;}
.waze-btn{
  width:100%; background:var(--accent); color:var(--accent-ink); border:none;
  border-radius:12px; padding:14px; font-weight:700; font-size:15px; font-family:var(--font-body);
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none;
}
.suggested-subactions{display:flex; gap:8px; margin-top:10px;}
.suggested-subactions .btn{flex:1;}

/* TIMELINE */
.timeline{position:relative; padding-left:26px;}
.timeline::before{content:''; position:absolute; left:10px; top:6px; bottom:6px; width:2px; background:var(--line);}
.t-item{position:relative; padding:9px 0;}
.t-dot{
  position:absolute; left:-26px; top:11px; width:22px;height:22px;border-radius:50%;
  background:var(--surface); border:2px solid var(--line); display:flex; align-items:center; justify-content:center;
  font-size:11px; font-family:var(--font-mono); font-weight:700; color:var(--ink-soft);
}
.t-item.done .t-dot{background:var(--success); border-color:var(--success); color:#fff;}
.t-item.skipped .t-dot{background:var(--bg); border-color:var(--line); color:var(--ink-faint);}
.t-item.current .t-dot{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.t-row{
  display:flex; align-items:center; gap:10px; background:var(--surface); border-radius:12px; padding:9px 10px; box-shadow:var(--shadow);
}
.t-item.done .t-row{opacity:.6;}
.t-item.skipped .t-row{opacity:.55;}
.t-info{flex:1; min-width:0;}
.t-name{font-weight:700; font-size:13.5px;}
.t-item.done .t-name, .t-item.skipped .t-name{text-decoration:line-through;}
.t-addr{font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.t-actions{display:flex; gap:4px; flex-shrink:0;}

.section-title{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; color:var(--ink-faint); margin:18px 0 8px 2px; text-transform:uppercase;
}
.banner{
  background:var(--danger-bg); color:#8A2A2E; border-radius:12px; padding:10px 12px; font-size:12.5px; margin-bottom:12px;
}
.banner.ok{background:var(--success-bg); color:#1D6B30;}
.inline-edit{margin-top:8px; padding-top:8px; border-top:1.5px dashed var(--line);}
.route-switcher{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
.route-switcher::-webkit-scrollbar{display:none;}
